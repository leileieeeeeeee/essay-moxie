<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trip 管理 V10</title>
<style>body{margin:0;background:#f5f2eb;color:#17232b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}main{max-width:760px;margin:auto;padding:14px}.btn{border:0;border-radius:999px;padding:9px 12px;font-weight:700;background:#e8f1f3;color:#17596b;text-decoration:none}.primary{background:#176d87;color:white}.head{display:flex;justify-content:space-between;align-items:center}.status,.card{background:#fffefa;border:1px solid #e5ddd1;border-radius:15px;padding:12px;margin-top:10px}.event{display:grid;grid-template-columns:55px 1fr auto;gap:8px;padding:11px 0;border-top:1px solid #eee7dd}.event:first-child{border-top:0}.muted{font-size:12px;color:#748087}.tabs{display:flex;gap:6px;overflow:auto;margin-top:10px}.tab{border:1px solid #e5ddd1;background:#fffefa;border-radius:999px;padding:8px 10px;white-space:nowrap}.tab.on{background:#173d4b;color:white}</style></head>
<body><main><div class="head"><div><b>Australia 2026 · 管理 V10</b><div class="muted">官方 Supabase OAuth · 本地 SDK</div></div><a class="btn" href="index.html">← 查看页</a></div><div class="status" id="status">加载登录组件…</div><div id="login"></div><div class="tabs" id="tabs"></div><div id="view"></div></main>
<script src="./supabase.js"></script><script>
const URL="https://dstkvlhjomuyoceijfft.supabase.co",KEY="sb_publishable_DkP-qII7LMS2C-FuBhPAeQ_tOeA_MiM",REDIRECT="https://leileieeeeeeee.github.io/trip-companion/admin.html";
let sb,user,trip,events=[],cur="";
const $=q=>document.querySelector(q);function err(e){$("#status").textContent="⚠ "+(e?.message||e);console.error(e)}
async function boot(){try{if(!window.supabase)throw new Error("本地 supabase.js 未加载");sb=window.supabase.createClient(URL,KEY);let s=(await sb.auth.getSession()).data.session;if(!s){$("#status").textContent="尚未登录";$("#login").innerHTML='<button class="btn primary" id="go">Google 登录</button>';$("#go").onclick=()=>sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:REDIRECT}});return}user=s.user;$("#status").textContent=(user.user_metadata?.full_name||user.email)+" · ☁ 管理模式";$("#login").innerHTML='<button class="btn" id="out">退出</button>';$("#out").onclick=()=>sb.auth.signOut().then(()=>location.reload());let t=await sb.from("trips").select("*").eq("slug","australia-2026").single();if(t.error)throw t.error;trip=t.data;await load()}catch(e){err(e)}}
async function load(){let r=await sb.from("events").select("*").eq("trip_id",trip.id).order("event_date").order("event_time");if(r.error)throw r.error;events=r.data;tabs()}
function tabs(){let ds=[...new Set(events.map(e=>e.event_date))];cur=cur||ds[0];$("#tabs").innerHTML=ds.map(d=>`<button class="tab" data-d="${d}">${d.slice(5).replace("-","/")}</button>`).join("");document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{cur=b.dataset.d;render()});render()}
function render(){document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.d===cur));let a=events.filter(e=>e.event_date===cur);$("#view").innerHTML='<div class="card">'+a.map(e=>`<div class="event"><b>${String(e.event_time).slice(0,5)}</b><div><b>${e.title}</b><div class="muted">${e.place_name||""}${e.locked?" · 🔒":""}</div></div><div><button class="btn" onclick="editE('${e.id}')">编辑</button> <button class="btn" onclick="doneE('${e.id}')">${e.completed?"取消完成":"完成"}</button></div></div>`).join("")+"</div>"}
window.editE=async id=>{let e=events.find(x=>x.id===id),time=prompt("时间",String(e.event_time).slice(0,5));if(time===null)return,title=prompt("行程",e.title);if(title===null)return,place=prompt("地点 / 导航",e.place_name||"");if(place===null)return;let r=await sb.from("events").update({event_time:time+":00",title,place_name:place}).eq("id",id).select().single();if(r.error)return err(r.error);Object.assign(e,r.data);render();$("#status").textContent="✓ 已同步修改"}
window.doneE=async id=>{let e=events.find(x=>x.id===id),r=await sb.rpc("set_event_completed",{p_event:id,p_completed:!e.completed});if(r.error)return err(r.error);e.completed=!e.completed;render();$("#status").textContent="✓ 完成状态已同步"}
boot();
</script></body></html>
