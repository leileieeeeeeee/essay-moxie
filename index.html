<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173d4b"><title>Australia 2026</title>
<style>
:root{--bg:#f5f2eb;--card:#fffefa;--ink:#17232b;--muted:#748087;--line:#e5ddd1;--blue:#176d87;--navy:#173d4b;--gold:#d69a3b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}button{font:inherit}main{max-width:760px;margin:auto;padding:10px 11px 80px}.head{display:flex;justify-content:space-between;align-items:center}.muted{font-size:12px;color:var(--muted)}.tabs{display:flex;gap:7px;overflow:auto;position:sticky;top:0;background:var(--bg);padding:9px 0;z-index:3}.tab,.btn{border:0;border-radius:999px;padding:8px 11px;font-weight:750}.tab{background:var(--card);border:1px solid var(--line);white-space:nowrap}.tab.on{background:var(--navy);color:#fff}.now{background:linear-gradient(135deg,#173d4b,#18748c);color:#fff;border-radius:21px;padding:16px}.now h2{margin:4px 0}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:13px;margin-top:9px}.hotel{border-left:4px solid var(--gold)}.event{display:grid;grid-template-columns:52px 1fr;gap:8px;padding:12px 0;border-top:1px solid #eee7dd}.event:first-child{border-top:0}.event.done{opacity:.3}.event small{color:var(--muted)}.chip{font-size:11px;background:#edf3f4;border-radius:999px;padding:5px 8px;display:inline-block;margin:3px}.status{padding:9px 11px;background:#edf4f5;border-radius:12px;margin:8px 0;font-size:12px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.primary{background:#fff;color:#17495a}.soft{background:#e9f1f3;color:#17596b}a{text-decoration:none}.error{background:#fff0ed;color:#8a2f24}
</style></head><body><main><header class="head"><div><b>Australia 2026 <small>V9</small></b><div class="muted">👁 分享查看 · 零外部 JS</div></div><div><a class="btn soft" href="admin.html">管理</a> <button class="btn soft" onclick="location.reload()">刷新</button></div></header><div class="status" id="status">☁ 正在读取最新行程…</div><nav class="tabs" id="tabs"></nav><div id="view"></div></main>
<script>
const BASE="https://dstkvlhjomuyoceijfft.supabase.co/rest/v1",KEY="sb_publishable_DkP-qII7LMS2C-FuBhPAeQ_tOeA_MiM";
const H={"apikey":KEY,"Authorization":"Bearer "+KEY};
const hotels={"2026-09-26":"搭子悉尼住宿 · 待补充","2026-09-27":"TRYP by Wyndham Southport Gold Coast","2026-09-28":"TRYP by Wyndham Southport Gold Coast","2026-09-29":"TRYP by Wyndham Southport Gold Coast","2026-09-30":"TRYP by Wyndham Southport Gold Coast","2026-10-01":"悉尼住宿 · 待补充","2026-10-02":"悉尼住宿 · 待补充","2026-10-03":"悉尼住宿 · 待补充","2026-10-04":"今晚不住宿"};
let trip,events=[],cur="总览";const $=q=>document.querySelector(q);const map=q=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q||"");const today=()=>new Intl.DateTimeFormat("en-CA",{timeZone:"Australia/Sydney"}).format(new Date());const nowm=()=>{let p=new Intl.DateTimeFormat("en-GB",{timeZone:"Australia/Sydney",hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date()).split(":");return +p[0]*60 + +p[1]};const mins=t=>{let p=String(t).slice(0,5).split(":");return +p[0]*60 + +p[1]};
async function get(path){let c=new AbortController(),t=setTimeout(()=>c.abort(),8000);try{let r=await fetch(BASE+path,{headers:H,signal:c.signal});if(!r.ok)throw new Error("HTTP "+r.status+" · "+await r.text());return await r.json()}finally{clearTimeout(t)}}
async function boot(){try{let ts=await get("/trips?slug=eq.australia-2026&select=id,name,public_read&limit=1");if(!ts.length)throw new Error("未找到公开 Australia 2026");trip=ts[0];events=await get("/events?trip_id=eq."+trip.id+"&select=id,event_date,event_time,title,place_name,locked,completed&order=event_date.asc,event_time.asc");$("#status").textContent="☁ 最新行程 · "+events.length+" 项 · "+new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});tabs();if(today()>="2026-09-26"&&today()<="2026-10-04")cur=today();render()}catch(e){$("#status").classList.add("error");$("#status").textContent="⚠ 读取失败："+(e.name==="AbortError"?"连接超时":e.message)+" · 点击刷新重试";console.error(e)}}
function tabs(){let ds=[...new Set(events.map(e=>e.event_date))];$("#tabs").innerHTML='<button class="tab" data-d="总览">总览</button>'+ds.map(d=>`<button class="tab" data-d="${d}">${d.slice(5).replace("-","/")}</button>`).join("");document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{cur=b.dataset.d;render()})}
async function weather(date){let city=date>="2026-09-27"&&date<="2026-09-30"?"gc":date==="2026-10-02"?"kiama":"syd",p=city==="gc"?[-28.0167,153.4]:city==="kiama"?[-34.6713,150.8565]:[-33.8688,151.2093];try{let r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${p[0]}&longitude=${p[1]}&current=temperature_2m,apparent_temperature,precipitation,wind_speed_10m&timezone=auto`),j=await r.json(),w=j.current;$("#weather").innerHTML=`<span class="chip">🌡 ${w.temperature_2m}° · 体感${w.apparent_temperature}°</span><span class="chip">🌧 ${w.precipitation}mm</span><span class="chip">💨 ${w.wind_speed_10m}km/h</span><span class="chip">${w.apparent_temperature<18?"🧥 薄外套":w.precipitation>0?"☂️ 雨具":"👕 轻装+防晒"}</span>`}catch(e){$("#weather").textContent="天气暂不可用"}}
function routeUrl(list){
 const pts=list.filter(e=>e.place_name).map(e=>e.place_name); if(!pts.length)return "#";
 if(pts.length===1)return map(pts[0]);
 const origin=pts[0],destination=pts[pts.length-1],waypoints=pts.slice(1,-1).join("|");
 return "https://www.google.com/maps/dir/?api=1&origin="+encodeURIComponent(origin)+"&destination="+encodeURIComponent(destination)+(waypoints?"&waypoints="+encodeURIComponent(waypoints):"")+"&travelmode=transit";
}
function render(){document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.d===cur));if(cur==="总览"){ $("#view").innerHTML=`<div class="now"><small>分享查看</small><h2>Australia 2026</h2><p>${events.length} 个云端项目</p></div><div class="card"><span class="chip">☀️ 天气</span><span class="chip">🧭 导航</span><span class="chip">🏨 酒店</span><span class="chip">🚋 行程交通</span></div>`;return}let list=events.filter(e=>e.event_date===cur),n=cur===today()?nowm():-1,next=list.find(e=>!e.completed&&(cur!==today()||mins(e.event_time)>=n))||list.find(e=>!e.completed)||list.at(-1);let rows=list.map(e=>`<div class="event ${e.completed?'done':''}"><b>${String(e.event_time).slice(0,5)}</b><div><b>${e.title}</b><br><small>${e.place_name||""}${e.locked?" · 🔒":""}</small>${e.place_name?`<div style="margin-top:5px"><a target="_blank" href="${map(e.place_name)}" style="font-size:12px;color:#176d87">🧭 导航</a></div>`:""}</div></div>`).join("");$("#view").innerHTML=`<div class="now"><small>现在该干嘛</small><h2>${next?String(next.event_time).slice(0,5)+" · "+next.title:"今天完成"}</h2>${next?.place_name?`<div class="actions"><a class="btn primary" target="_blank" href="${map(next.place_name)}">🧭 下一站</a><a class="btn primary" target="_blank" href="${routeUrl(list.filter(e=>!e.completed))}">🗺 今日剩余路线</a></div>`:""}</div><div class="card" id="weather">☀️ 更新天气中…</div><div class="card hotel"><small class="muted">🏨 今晚住哪</small><b style="display:block">${hotels[cur]||"待确认"}</b>${hotels[cur]&&hotels[cur]!=="今晚不住宿"?`<div class="actions"><a class="btn soft" target="_blank" href="${map(hotels[cur])}">酒店导航</a></div>`:""}</div><div class="card">${rows}</div>`;weather(cur)}
boot();
</script></body></html>
